[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mylabdata"
version = "2.0.0.dev0"
description = "MyLabData molecule-centered data management backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "fastapi",
    "openpyxl",
    "pydantic-settings",
    "pyarrow",
    "uvicorn[standard]",
    "rdkit>=2026.3.6",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: exercises DuckDB and multiple backend layers",
    "performance: opt-in real-scale benchmark (use --run-performance)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
